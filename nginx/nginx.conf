events {
    worker_connections 1024;
}

http {
    # Upstreams point at the compose service names
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # For production TLS, terminate HTTPS here (listen 443 ssl) and
        # mount your certs. See the commented block below.

        client_max_body_size 10m;

        # API + auth + webhooks -> FastAPI backend
        location ~ ^/(auth|repos|reviews|stats|webhooks|health|docs|openapi.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Example HTTPS server (uncomment and provide certs in production) ---
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     # ... same location blocks as above ...
    # }
}
